name: Android Release APK CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign-release-apk:
    name: Test, Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          java-package: jdk

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK Platform 36.1 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Debug Keystore for Unit Tests
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Decode & Prepare Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Missing required signing secrets (KEYSTORE_BASE64, STORE_PASSWORD). Please add them in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          EFFECTIVE_KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          echo "EFFECTIVE_KEY_PASSWORD=$EFFECTIVE_KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"

          # app/build.gradle.kts expects keyAlias = "upload".
          # If a custom KEY_ALIAS secret is provided and differs from "upload", align it automatically.
          if [ -n "$KEY_ALIAS" ] && [ "$KEY_ALIAS" != "upload" ]; then
            if ! keytool -list -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" -storepass "$STORE_PASSWORD" -alias "upload" >/dev/null 2>&1; then
              keytool -changealias \
                -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
                -storepass "$STORE_PASSWORD" \
                -alias "$KEY_ALIAS" \
                -destalias "upload" \
                -keypass "$EFFECTIVE_KEY_PASSWORD"
            fi
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.EFFECTIVE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --no-configuration-cache

      - name: Verify APK Signature & Zero Internet Permission
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not found at $APK_PATH"
            exit 1
          fi
          APKSIGNER="$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          AAPT2="$(find $ANDROID_HOME/build-tools -name aapt2 | sort -V | tail -n 1)"
          if "$AAPT2" dump permissions "$APK_PATH" | grep -q "android.permission.INTERNET"; then
            echo "::error::Release APK unexpectedly contains android.permission.INTERNET!"
            exit 1
          fi
          echo "Verified: Signed Release APK contains zero INTERNET permissions."

      - name: Clean Up Decoded Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalAccountOrganizer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (on version tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
